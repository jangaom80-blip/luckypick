<!-- 분석 중 프로그레스 연출 (호기심 유발) -->
<div id="loadingBox" style="display:none; text-align:center; padding: 20px;">
  <div style="font-size: 0.85rem; color: #D4AF37; margin-bottom: 8px;">
    ⚡ 최근 10회차 미출현 가중치 알고리즘 연산 중...
  </div>
  <div style="width: 100%; height: 6px; background: #1e293b; border-radius: 4px; overflow: hidden;">
    <div id="progressBar" style="width: 0%; height: 100%; background: #D4AF37; transition: width 1.5s ease-out;"></div>
  </div>
</div>

<!-- 보상형 락(Lock) 해제 버튼 (수익화 핵심) -->
<div class="card" style="border: 1px dashed #D4AF37; text-align: center; margin-top: 15px;">
  <div style="font-size: 0.9rem; font-weight: bold; color: #f8fafc;">
    🔒 이번 주 미출현 번호 집중 조합 (D, E세트)
  </div>
  <p style="font-size: 0.75rem; color: #94a3b8; margin: 6px 0 12px;">
    5초 안내 확인 후 황금 번호 2세트가 즉시 해금됩니다.
  </p>
  <button onclick="unlockExtraSets()" style="background: #D4AF37; color: #000; font-weight: bold; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer;">
    ✨ 무료로 잠금 해제하기
  </button>
</div>
